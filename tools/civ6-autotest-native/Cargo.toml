[package]
name = "civ6-autotest-native"
version = "0.1.0"
edition = "2024"
default-run = "civ6-autotest-native"

[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
quick-xml = "0.37"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[profile.release]
strip = true

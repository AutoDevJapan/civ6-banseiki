[package]
name = "civ6-reports-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
mlua = { version = "0.11", features = ["lua51", "vendored", "serialize"] }
tempfile = "3"

[[bin]]
name = "civ6-arbitration-report"
path = "src/bin/arbitration_report.rs"

[[bin]]
name = "civ6-tuning-report"
path = "src/bin/tuning_report.rs"

[[bin]]
name = "civ6-research-report"
path = "src/bin/research_report.rs"

[[bin]]
name = "civ6-build-arbitration-ai-scenario"
path = "src/bin/build_arbitration_ai_scenario.rs"

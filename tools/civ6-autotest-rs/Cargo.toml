[package]
name = "civ6-autotest-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
civ6-bootstrap-rs = { path = "../civ6-bootstrap-rs" }
civ6-cli-compat-rs = { path = "../civ6-cli-compat-rs" }
civ6-native-probe-rs = { path = "../civ6-native-probe-rs", features = ["bootstrap-order"] }
civ6-native-bridge-rs = { path = "../civ6-native-bridge-rs" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
sha2 = "0.10"
csv = "1"
roxmltree = "0.21"
flate2 = "1"
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
ctrlc = "3"
caseless = "0.2.2"
png = "0.18"

[build-dependencies]
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Pipes", "Wdk_Graphics_Direct3D", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Security"] }

[dev-dependencies]
civ6-reports-rs = { path = "../civ6-reports-rs" }
tempfile = "3"
mlua = { version = "0.11", features = ["lua51", "vendored"] }
rusqlite = { version = "0.37", features = ["bundled"] }

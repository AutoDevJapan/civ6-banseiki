name: Rust tools and Lua tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/Cargo.toml --all -- --check
      - name: Run all Rust and Lua tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tools/Cargo.toml --workspace --all-targets -- --nocapture 2>&1 | Tee-Object -FilePath rust-tests.log
          $testExit = $LASTEXITCODE
          $log = Get-Content -LiteralPath rust-tests.log -Raw
          $vendors = @([regex]::Matches($log, 'ATOMIC_CPU vendor=(\S+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          $executed = @([regex]::Matches($log, 'ATOMIC_FIXTURE status=EXECUTED cpu_vendor=\S+ test=([^;\s]+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          $notExecuted = @([regex]::Matches($log, 'ATOMIC_FIXTURE status=NOT_EXECUTED cpu_vendor=\S+ test=([^;\s]+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          @(
            '### Native atomic instruction fixtures'
            ''
            ('CPU vendor: ' + ($vendors -join ', '))
            'Condition: Windows x86_64, AuthenticAMD'
            ('EXECUTED: ' + $executed.Count)
            ('NOT EXECUTED: ' + $notExecuted.Count)
            $(if (!$IsWindows) { 'Windows fixtures NOT EXECUTED on this OS; counts above are observed fixture reports only.' })
            'Cargo success alone does not establish native fixture execution.'
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($testExit -ne 0) { exit $testExit }
          if ($vendors.Count -ne 1) { throw 'CPU vendor report missing or ambiguous' }
          if ($IsWindows -and ($executed.Count + $notExecuted.Count) -eq 0) { throw 'Native atomic fixture reports missing' }
      - name: Run all workspace doctests
        run: cargo test --locked --manifest-path tools/Cargo.toml --workspace --doc
      - name: Release test build space before compiling release tools
        run: cargo clean --manifest-path tools/Cargo.toml --profile dev
      - name: Build all tools
        run: cargo build --locked --release --manifest-path tools/Cargo.toml --workspace --bins
      - name: Check existing scenario JSON
        shell: pwsh
        run: |
          $driver = if ($IsWindows) { './tools/target/release/civ6-autotest.exe' } else { './tools/target/release/civ6-autotest' }
          $scenarios = @(Get-ChildItem -LiteralPath tools/civ6-autotest/scenarios -Filter '*.json')
          if ($scenarios.Count -eq 0) { throw 'No scenarios found' }
          foreach ($scenario in $scenarios) {
            & $driver $scenario.FullName --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

name: Rust tools and Lua tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ (github.repository_id == '1392152644' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 148 && github.event.pull_request.head.repo.id == 1392152644) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/todo2640-workspace-doctests-20261015'))) && format('cc-product-2736-1392152644-{0}', matrix.os) || matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ (github.repository_id == '1392152644' && ((github.event_name == 'pull_request' && github.event.pull_request.number == 148 && github.event.pull_request.head.repo.id == 1392152644) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/todo2640-workspace-doctests-20261015'))) && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/Cargo.toml --all -- --check
      - name: Run all Rust and Lua tests
        run: cargo test --locked --manifest-path tools/Cargo.toml --workspace --all-targets
      - name: Run all workspace doctests
        run: cargo test --locked --manifest-path tools/Cargo.toml --workspace --doc
      - name: Build all tools
        run: cargo build --locked --release --manifest-path tools/Cargo.toml --workspace --bins
      - name: Check existing scenario JSON
        shell: pwsh
        run: |
          $driver = if ($IsWindows) { './tools/target/release/civ6-autotest.exe' } else { './tools/target/release/civ6-autotest' }
          $scenarios = @(Get-ChildItem -LiteralPath tools/civ6-autotest/scenarios -Filter '*.json')
          if ($scenarios.Count -eq 0) { throw 'No scenarios found' }
          foreach ($scenario in $scenarios) {
            & $driver $scenario.FullName --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

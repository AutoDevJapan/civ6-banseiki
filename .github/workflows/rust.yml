name: Rust tools and Lua tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && matrix.os || fromJSON(format(matrix.os == 'ubuntu-latest' && '["self-hosted","Linux","X64","civ6-ci-linux","civ6-ci-run-{0}-{1}-test-Linux"]' || '["self-hosted","Windows","X64","civ6-ci-windows","civ6-ci-run-{0}-{1}-test-Windows"]', github.run_id, github.run_attempt)) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/Cargo.toml --all -- --check
      - name: Run all Rust and Lua tests
        run: cargo test --locked --manifest-path tools/Cargo.toml --workspace --all-targets
      - name: Run workspace doctests
        run: cargo test --locked --manifest-path tools/Cargo.toml --workspace --doc
      - name: Build all tools
        run: cargo build --locked --release --manifest-path tools/Cargo.toml --workspace --bins
      - name: Record release binary hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -notmatch '^[0-9a-f]{40}$') { throw 'Source revision is unavailable' }
          $files = @(Get-ChildItem -LiteralPath './tools/target/release' -File | Where-Object { if ($IsWindows) { $_.Extension -eq '.exe' } else { $_.Extension -eq '' } })
          if ($files.Count -eq 0) { throw 'No release binaries found' }
          $hashes = @($files | ForEach-Object { @{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          @{ source_sha = $source; runner_os = $env:RUNNER_OS; binaries = $hashes } | ConvertTo-Json -Depth 5
      - name: Check existing scenario JSON
        shell: pwsh
        run: |
          $driver = if ($IsWindows) { './tools/target/release/civ6-autotest.exe' } else { './tools/target/release/civ6-autotest' }
          $scenarios = @(Get-ChildItem -LiteralPath tools/civ6-autotest/scenarios -Filter '*.json')
          if ($scenarios.Count -eq 0) { throw 'No scenarios found' }
          foreach ($scenario in $scenarios) {
            & $driver $scenario.FullName --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
